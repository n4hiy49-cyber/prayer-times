<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shah Jalal Jami Masjid — Prayer Times</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0A2E22;
    --bg-deep: #071F17;
    --panel: #0E3A2B;
    --gold: #C9A24B;
    --gold-soft: #E6C878;
    --cream: #F4EFE2;
    --cream-dim: #C9C2AC;
    --line: rgba(201,162,75,0.35);
    --jamat-ink: #08251C;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #0A2E22; --bg-deep:#071F17; --panel:#0E3A2B; --gold:#C9A24B; --gold-soft:#E6C878; --cream:#F4EFE2; --cream-dim:#C9C2AC; --line: rgba(201,162,75,0.35);
    }
  }
  :root[data-theme="dark"]{
    --bg: #0A2E22; --bg-deep:#071F17; --panel:#0E3A2B; --gold:#C9A24B; --gold-soft:#E6C878; --cream:#F4EFE2; --cream-dim:#C9C2AC; --line: rgba(201,162,75,0.35);
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: radial-gradient(120% 100% at 50% -10%, var(--panel) 0%, var(--bg) 45%, var(--bg-deep) 100%);
    color: var(--cream);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    min-height: 100vh;
    display:flex;
    justify-content:center;
    padding: clamp(16px, 5vw, 40px);
  }

  .board{
    width: 100%;
    max-width: 460px;
    position: relative;
  }

  .frame{
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 30px 22px 24px;
    background: linear-gradient(180deg, rgba(230,200,120,0.05), rgba(0,0,0,0) 30%);
    position: relative;
    overflow: hidden;
  }

  .lattice{
    position:absolute;
    left:0; right:0;
    height: 18px;
    opacity: 0.55;
  }
  .lattice.top{ top: 0; }
  .lattice.bottom{ bottom: 0; transform: scaleY(-1); }

  .crest{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding-top: 14px;
    margin-bottom: 22px;
  }

  .crest .emblem{
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: rgba(244,239,226,0.04);
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom: 14px;
  }

  .crest h1{
    font-family: 'Amiri', serif;
    font-weight: 700;
    font-size: clamp(24px, 6vw, 30px);
    line-height: 1.15;
    margin: 0 0 4px;
    letter-spacing: 0.01em;
  }

  .crest p.assoc{
    margin: 0;
    font-size: 13px;
    color: var(--cream-dim);
    letter-spacing: 0.06em;
  }

  .clock{
    text-align:center;
    font-family:'IBM Plex Sans', sans-serif;
    font-weight: 600;
    font-size: clamp(38px, 11vw, 52px);
    letter-spacing: 0.02em;
    color: var(--cream);
    font-variant-numeric: tabular-nums;
    line-height: 1;
    margin: 4px 0 4px;
    text-shadow: 0 0 18px rgba(201,162,75,0.25);
  }
  .clock .secs{
    font-size: 0.42em;
    color: var(--gold-soft);
    font-weight: 500;
    margin-left: 2px;
    vertical-align: baseline;
  }
  .clock .ampm{
    font-size: 0.32em;
    color: var(--cream-dim);
    font-weight: 500;
    letter-spacing: 0.08em;
    vertical-align: super;
  }

  .datebar{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 10px;
    margin: 18px 0 22px;
    color: var(--gold-soft);
    font-size: 14px;
  }
  .datebar .divot{
    width:5px; height:5px; border-radius:50%;
    background: var(--gold);
    opacity:0.7;
  }
  .datebar .hijri{ font-family:'Amiri', serif; font-size: 15px; }

  table.times{
    width: 100%;
    border-collapse: collapse;
  }
  table.times thead th{
    font-size: 11px;
    letter-spacing: 0.05em;
    color: var(--cream-dim);
    font-weight: 500;
    text-align: left;
    padding: 0 4px 8px;
    border-bottom: 1px solid var(--line);
  }
  table.times thead th.num{ text-align: right; }
  table.times thead th.jamat{ text-align: right; color: var(--gold-soft); }

  table.times tbody td{
    padding: 13px 4px;
    border-bottom: 1px solid rgba(201,162,75,0.14);
    vertical-align: middle;
  }
  table.times tbody tr:last-child td{ border-bottom: none; }

  td.name{
    font-family:'Amiri', serif;
    font-size: 18px;
  }
  td.name .ar{ display:block; font-size: 12px; color: var(--cream-dim); font-family:'IBM Plex Sans',sans-serif; margin-top:1px; }

  td.begin{
    text-align: right;
    color: var(--cream-dim);
    font-size: 14px;
    font-variant-numeric: tabular-nums;
  }

  td.jamat{
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  td.jamat span{
    display:inline-block;
    min-width: 64px;
    background: var(--gold);
    color: var(--jamat-ink);
    font-weight: 600;
    font-size: 17px;
    padding: 5px 10px;
    border-radius: 8px;
  }

  tr.dim td.jamat span{
    background: rgba(201,162,75,0.16);
    color: var(--gold-soft);
    font-weight: 500;
  }

  .footer{
    margin-top: 24px;
    text-align: center;
    font-size: 11px;
    color: var(--cream-dim);
    opacity: 0.6;
    letter-spacing: 0.03em;
  }

  @media (max-width: 360px){
    td.name{ font-size: 16px; }
    td.jamat span{ font-size: 15px; min-width: 56px; }
  }
</style>
</head>
<body>
<div class="board">
  <div class="frame">
    <svg class="lattice top" viewBox="0 0 460 18" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <pattern id="star" width="30" height="18" patternUnits="userSpaceOnUse">
          <path d="M15 2 L18 8 L24 9 L18 10 L15 16 L12 10 L6 9 L12 8 Z" fill="none" stroke="#C9A24B" stroke-width="0.8"/>
        </pattern>
      </defs>
      <rect width="460" height="18" fill="url(#star)"/>
    </svg>

    <div class="crest">
      <div class="emblem" role="img" aria-label="Mosque logo">
        <svg width="34" height="34" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M17 4C11 6.5 8 11 8 17c0 6.6 5.4 12 12 12 2 0 3.9-.5 5.5-1.4C21.6 29 18 24.8 18 19.8c0-6 4.3-11 10-12.4C25.7 5.2 21.6 4 17 4z" fill="#C9A24B"/>

        </svg>
      </div>
      <h1>Shah Jalal Jami Masjid</h1>
      <p class="assoc">Jamia Qurania · Keighley</p>
    </div>

    <div class="clock" id="clock">--:--<span class="secs" id="clock-secs">:--</span> <span class="ampm" id="clock-ampm">--</span></div>

    <div class="datebar">
      <span id="greg-day">Wednesday</span>
      <span class="divot"></span>
      <span class="hijri" id="hijri-date">3 Rabiʿ II 1448 AH</span>
    </div>

    <table class="times">
      <thead>
        <tr>
          <th>Prayer</th>
          <th class="num">Begins</th>
          <th class="jamat">Jamā'ah</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="name">Fajr<span class="ar">الفجر</span></td>
          <td class="begin" id="fajr-begin">5:01</td>
          <td class="jamat"><span id="fajr-jamat">6:00</span></td>
        </tr>
        <tr>
          <td class="name">Zuhr<span class="ar">الظهر</span></td>
          <td class="begin" id="zuhr-begin">1:05</td>
          <td class="jamat"><span id="zuhr-jamat">1:45</span></td>
        </tr>
        <tr>
          <td class="name">Asr<span class="ar">العصر</span></td>
          <td class="begin" id="asr-begin">5:18</td>
          <td class="jamat"><span id="asr-jamat">6:00</span></td>
        </tr>
        <tr class="dim">
          <td class="name">Maghrib<span class="ar">المغرب</span></td>
          <td class="begin" id="maghrib-begin">—</td>
          <td class="jamat"><span id="maghrib-jamat">7:25</span></td>
        </tr>
        <tr>
          <td class="name">Isha'a<span class="ar">العشاء</span></td>
          <td class="begin" id="isha-begin">8:18</td>
          <td class="jamat"><span id="isha-jamat">9:15</span></td>
        </tr>
        <tr class="dim">
          <td class="name">Jumu'ah<span class="ar">الجمعة</span></td>
          <td class="begin">—</td>
          <td class="jamat"><span id="jumuah-jamat">1:45</span></td>
        </tr>
      </tbody>
    </table>

    <svg class="lattice bottom" viewBox="0 0 460 18" preserveAspectRatio="none" aria-hidden="true">
      <rect width="460" height="18" fill="url(#star)"/>
    </svg>
  </div>
  <div class="footer" id="footer">Calculating…</div>
</div>

    set('asr-begin', to12h(row.aB));
    set('isha-begin', to12h(row.iB));

    set('fajr-jamat', to12h(row.fJ));
    set('zuhr-jamat', to12h(row.zJ));
    set('asr-jamat', to12h(row.aJ));
    set('maghrib-jamat', to12h(row.mJ));
    set('isha-jamat', to12h(row.iJ));
    set('jumuah-jamat', to12h(row.juJ));

    set('greg-day', WEEKDAYS[now.getDay()]);
    set('hijri-date', row.isl + ' ' + row.hm + ' ' + row.hy + HIJRI_SUFFIX);

    var stamp = now.toLocaleDateString('en-GB', {day:'2-digit', month:'2-digit', year:'numeric'}) + ' ' +
                now.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});
    set('footer', "Shah Jalal Jami Masjid 2026 timetable · " + stamp);
  }

  function tickClock(){
    var now = new Date();
    var h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
    var h12 = h % 12; if (h12 === 0) h12 = 12;
    var hh = (h12<10?'0':'') + h12;
    var mm = (m<10?'0':'') + m;
    var ss = (s<10?'0':'') + s;
    var ampm = h < 12 ? 'AM' : 'PM';
    var clockEl = document.getElementById('clock');
    var secsEl = document.getElementById('clock-secs');
    var ampmEl = document.getElementById('clock-ampm');
    if (clockEl && secsEl && ampmEl){
      clockEl.firstChild.textContent = hh + ':' + mm;
      secsEl.textContent = ':' + ss;
      ampmEl.textContent = ampm;
    }
  }

  render();
  setInterval(render, 60000);
  tickClock();
  setInterval(tickClock, 1000);
})();
</script>

</body>
</html>
